apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: customresources.platform.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: platform/customresource-serving-cert
spec:
  group: platform.cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              name:
                type: string
                description: Resource name
              enabled:
                type: boolean
                description: Enable resource
              config:
                type: object
                description: Configuration settings
                additionalProperties:
                  type: string
                  description: Configuration properties for config
  names:
    kind: CustomResource
    plural: customresources
    singular: customresource
  scope: Namespaced
