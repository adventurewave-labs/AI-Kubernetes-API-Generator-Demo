apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitoringservices.monitoring.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: monitoring/monitoringservice-serving-cert
spec:
  group: monitoring.cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              interval:
                type: string
                description: Metrics collection interval
              retention:
                type: string
                description: Data retention period
              endpoints:
                type: array
                description: Monitoring endpoints
                items:
                  type: string
                  description: Array item for endpoints
  names:
    kind: MonitoringService
    plural: monitoringservices
    singular: monitoringservice
  scope: Namespaced
---
apiVersion: monitoring.cnoe.io/v1alpha1
kind: MonitoringService
metadata:
  name: my-monitoringservice-instance
  namespace: default
spec:
  interval: example-value
  retention: example-value
  endpoints:
  - item1
  - item2
  - item3
