apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redisclusters.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: 'cnoe-io/rediscluster-serving-cert'
spec:
  group: cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: f"database.cnoe.io/v1alpha1"
          kind:
            type: string
            description: "RedisCluster"
          metadata:
            type: object
          spec:
            type: object
            properties:
              memory:
                type: string
                description: "Memory limit for Redis cluster" 
              cpu:
                type: string
                description: "CPU request for Redis cluster" 
              persistence:
                type: boolean
                description: "Enable persistent storage" 
              replicas:
                type: integer
                description: "Number of Redis replicas" 
  names:
    kind: RedisCluster
    plural: redisclusters
    singular: rediscluster
  scope: Namespaced
---
apiVersion: cnoe.io/v1alpha1
kind: RedisCluster
metadata:
  name: my-rediscluster-instance
  namespace: default
spec:
  memory: example-value
  cpu: example-value
  persistence: True
  replicas: 3
