apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseservices.database.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: database/databaseservice-serving-cert
spec:
  group: database.cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              connectionString:
                type: string
                description: Database connection string
              backupSchedule:
                type: string
                description: Cron schedule for backups
              autoScaling:
                type: boolean
                description: Enable auto-scaling
  names:
    kind: DatabaseService
    plural: databaseservices
    singular: databaseservice
  scope: Namespaced
---
apiVersion: database.cnoe.io/v1alpha1
kind: DatabaseService
metadata:
  name: my-databaseservice-instance
  namespace: default
spec:
  connectionString: example-value
  backupSchedule: example-value
  autoScaling: true
