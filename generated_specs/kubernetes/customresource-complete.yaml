apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: customresources.platform.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: platform/customresource-serving-cert
spec:
  group: platform.cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              name:
                type: string
                description: Resource name
              enabled:
                type: boolean
                description: Enable resource
              config:
                type: object
                description: Configuration settings
                properties:
                  key:
                    type: string
                    description: Configuration key for config
                  value:
                    type: string
                    description: Configuration value for config
                additionalProperties:
                  type: string
  names:
    kind: CustomResource
    plural: customresources
    singular: customresource
  scope: Namespaced
---
apiVersion: platform.cnoe.io/v1alpha1
kind: CustomResource
metadata:
  name: my-customresource-instance
  namespace: default
spec:
  name: example-value
  enabled: true
  config:
    key: example-key
    value: example-value
