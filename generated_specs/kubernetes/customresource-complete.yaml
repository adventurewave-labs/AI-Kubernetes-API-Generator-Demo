apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: customresources.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: 'cnoe-io/customresource-serving-cert'
spec:
  group: cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: f"platform.cnoe.io/v1alpha1"
          kind:
            type: string
            description: "CustomResource"
          metadata:
            type: object
          spec:
            type: object
            properties:
              name:
                type: string
                description: "Resource name" 
              enabled:
                type: boolean
                description: "Enable resource" 
              config:
                type: object
                description: "Configuration settings" 
  names:
    kind: CustomResource
    plural: customresources
    singular: customresource
  scope: Namespaced
---
apiVersion: cnoe.io/v1alpha1
kind: CustomResource
metadata:
  name: my-customresource-instance
  namespace: default
spec:
  name: example-value
  enabled: True
  config: example-value
