apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseservices.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: 'cnoe-io/databaseservice-serving-cert'
spec:
  group: cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: f"database.cnoe.io/v1alpha1"
          kind:
            type: string
            description: "DatabaseService"
          metadata:
            type: object
          spec:
            type: object
            properties:
              connectionStrings:
                type: string
                description: "connectionStrings" 
              backupSchedules:
                type: string
                description: "backupSchedules" 
              autoScaling:
                type: boolean
                description: "autoScaling" 
  names:
    kind: DatabaseService
    plural: databaseservices
    singular: databaseservice
  scope: Namespaced