apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: monitoringservices.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: 'cnoe-io/monitoringservice-serving-cert'
spec:
  group: cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: f"monitoring.cnoe.io/v1alpha1"
          kind:
            type: string
            description: "MonitoringService"
          metadata:
            type: object
          spec:
            type: object
            properties:
              interval:
                type: integer
                description: "interval" 
              retentionPolicy:
                type: string
                description: "retentionPolicy" 
  names:
    kind: MonitoringService
    plural: monitoringservices
    singular: monitoringservice
  scope: Namespaced