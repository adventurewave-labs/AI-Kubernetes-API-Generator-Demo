apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.cnoe.io
  annotations:
    cert-manager.io/inject-ca-from: 'cnoe-io/database-serving-cert'
spec:
  group: cnoe.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
            description: f"database.cnoe.io/v1alpha1"
          kind:
            type: string
            description: "Database"
          metadata:
            type: object
          spec:
            type: object
            properties:
              connectionStrings:
                type: string
                description: "connectionStrings" 
              backupSchedule:
                type: string
                description: "backupSchedule" 
              autoScaling:
                type: integer
                description: "autoScaling" 
  names:
    kind: Database
    plural: databases
    singular: database
  scope: Namespaced