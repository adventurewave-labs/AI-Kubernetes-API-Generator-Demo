apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cacheclusters.platform.cnoe.io
spec:
  group: platform.cnoe.io
  names:
    kind: CacheCluster
    listKind: CacheClusterList
    plural: cacheclusters
    singular: cachecluster
    shortNames: []
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: Schema for the CacheCluster resource.
        properties:
          spec:
            description: Specification of the desired CacheCluster.
            properties:
              memory:
                description: Memory budget per node, e.g. '8Gi'.
                type: string
              port:
                description: TCP port the cache listens on.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              size:
                description: T-shirt size, e.g. 'small', 'medium', 'large'.
                enum:
                - large
                - medium
                - small
                type: string
            required:
            - memory
            - port
            - size
            type: object
          status:
            description: Observed state of the CacheCluster.
            properties: {}
            type: object
        required:
        - spec
        type: object
    subresources:
      status: {}
