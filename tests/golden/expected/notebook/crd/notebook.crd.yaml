apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notebooks.datascience.cnoe.io
spec:
  group: datascience.cnoe.io
  names:
    kind: Notebook
    listKind: NotebookList
    plural: notebooks
    singular: notebook
    shortNames: []
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: Schema for the Notebook resource.
        properties:
          spec:
            description: Specification of the desired Notebook.
            properties:
              cpu:
                description: CPU request, e.g. '500m' or '2'.
                type: string
              gpu:
                description: Whether to attach a GPU to the notebook pod.
                type: boolean
              memory:
                description: Memory request, e.g. '4Gi'.
                type: string
            required:
            - cpu
            - gpu
            - memory
            type: object
          status:
            description: Observed state of the Notebook.
            properties: {}
            type: object
        required:
        - spec
        type: object
    subresources:
      status: {}
