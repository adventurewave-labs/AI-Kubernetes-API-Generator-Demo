apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redisclusters.cache.cnoe.io
spec:
  group: cache.cnoe.io
  names:
    kind: RedisCluster
    listKind: RedisClusterList
    plural: redisclusters
    singular: rediscluster
    shortNames: []
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: Schema for the RedisCluster resource.
        properties:
          spec:
            description: Specification of the desired RedisCluster.
            properties:
              memoryGiB:
                description: Memory budget per node, in GiB.
                format: int32
                maximum: 1024
                minimum: 1
                type: integer
              persistence:
                description: Whether AOF persistence is enabled.
                type: boolean
              port:
                description: TCP port the Redis cluster listens on.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
            required:
            - memoryGiB
            - persistence
            - port
            type: object
          status:
            description: Observed state of the RedisCluster.
            properties: {}
            type: object
        required:
        - spec
        type: object
    subresources:
      status: {}
