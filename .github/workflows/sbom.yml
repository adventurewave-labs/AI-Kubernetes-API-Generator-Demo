name: SBOM

# Generates a CycloneDX SBOM for the project on every push to main and on
# release tags. Uploaded as a workflow artifact, and (on tags) attached to the
# matching GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # only used by github-release on tag pushes

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project + cyclonedx-bom
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[release]"

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m cyclonedx_py environment -o sbom.cdx.json
          python -c "import json; json.load(open('sbom.cdx.json'))"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json
          fail_on_unmatched_files: false
